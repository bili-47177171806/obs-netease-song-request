<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>点歌面板</title>
<style>
  @font-face {
    font-family: "MaoKenZhuYuanTi";
    src: url("/assets/fonts/maoken.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --accent: #ff82b6;
    --text: #ffffff;
    --sub: rgba(255, 255, 255, .9);
    --card: rgba(219, 228, 255, .84);
    --ink: #405b97;
    --outline: #aeb9e9;
    --radius: 8px;
    --scale: 1;
    --font: "MaoKenZhuYuanTi", "Microsoft YaHei", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: transparent;
    font-family: var(--font);
    color: var(--text);
    overflow: hidden;
  }

  #root {
    padding: 18px;
    font-size: calc(16px * var(--scale));
  }

  .section + .section { margin-top: 20px; }

  .section-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 11px;
  }

  .spark {
    width: 10px;
    height: 10px;
    flex: 0 0 10px;
    transform: rotate(45deg);
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px rgba(174, 185, 233, .8);
  }

  h1 {
    margin: 0;
    font-size: 1.25em;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
    white-space: nowrap;
    text-shadow:
      -2px -2px 0 var(--outline), 2px -2px 0 var(--outline),
      -2px 2px 0 var(--outline), 2px 2px 0 var(--outline),
      0 2px 0 var(--outline);
  }

  .head-line {
    height: 2px;
    flex: 1;
    background: rgba(255, 255, 255, .9);
    box-shadow: 0 1px 0 rgba(137, 151, 211, .75);
  }

  .count {
    color: var(--text);
    font-size: .78em;
    white-space: nowrap;
    text-shadow:
      -1px -1px 0 var(--outline), 1px -1px 0 var(--outline),
      -1px 1px 0 var(--outline), 1px 1px 0 var(--outline);
  }

  .rules {
    margin: 0;
    padding: 0 3px;
    list-style: none;
  }

  .rules li {
    display: grid;
    grid-template-columns: minmax(0, auto) 1fr;
    gap: 10px;
    align-items: center;
    padding: 4px 0;
  }

  .rules code {
    font-family: var(--font);
    color: var(--ink);
    background: rgba(255, 255, 255, .9);
    border: 1px solid rgba(255, 255, 255, .95);
    border-radius: 8px;
    box-shadow: 0 2px 0 rgba(109, 126, 187, .5);
    padding: 3px 9px;
    white-space: nowrap;
  }

  .rules span {
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow:
      -1px -1px 0 var(--outline), 1px -1px 0 var(--outline),
      -1px 1px 0 var(--outline), 1px 1px 0 var(--outline);
  }

  ol.songs {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 9px;
  }

  ol.songs li {
    min-height: 48px;
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    padding: 7px 10px 7px 8px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, .95);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    box-shadow:
      0 3px 0 rgba(101, 119, 181, .5),
      inset 0 0 10px rgba(255, 255, 255, .55);
    animation: in .35s ease both;
  }

  @keyframes in {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: none; }
  }

  .idx {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 2px 0 rgba(102, 121, 184, .45);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-size: .9em;
  }

  .song-meta {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.02em;
    line-height: 1.2;
  }

  .user {
    margin-top: 3px;
    color: rgba(64, 91, 151, .72);
    font-size: .72em;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tags {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tag {
    padding: 2px 7px;
    border-radius: 999px;
    flex-shrink: 0;
    font-size: .68em;
    line-height: 1.5;
  }

  .tag.cut {
    background: var(--accent);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, .9);
    text-shadow: 0 1px 1px rgba(132, 50, 93, .45);
  }

  .tag.wait {
    background: rgba(255, 255, 255, .78);
    color: rgba(64, 91, 151, .78);
  }

  .empty {
    min-height: 78px;
    display: grid;
    place-items: center;
    color: var(--text);
    font-size: .95em;
    text-align: center;
    text-shadow:
      -1px -1px 0 var(--outline), 1px -1px 0 var(--outline),
      -1px 1px 0 var(--outline), 1px 1px 0 var(--outline);
  }

  .empty::before {
    content: "♪";
    display: block;
    margin-bottom: -22px;
    color: var(--accent);
    font-size: 2em;
    text-shadow: 0 2px 0 #fff;
  }

  .more {
    color: var(--text);
    font-size: .78em;
    padding: 9px 4px 0;
    text-align: right;
    text-shadow: 0 1px 2px var(--outline);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root">
  <section class="section" id="rules-card">
    <div class="section-head">
      <span class="spark"></span>
      <h1 id="rules-title">点歌指南</h1>
      <span class="head-line"></span>
    </div>
    <ul class="rules">
      <li><code>点歌 歌名 / ID</code><span>将歌曲加入队尾</span></li>
      <li><code>经典搜索 歌名</code><span>按歌名精确匹配，搜不准可用</span></li>
      <li><code>插队 歌名 / ID</code><span>粉丝团 11 级以上可插队点歌</span></li>
    </ul>
  </section>

  <section class="section">
    <div class="section-head">
      <span class="spark"></span>
      <h1 id="list-title">点歌池</h1>
      <span class="head-line"></span>
      <span class="count" id="count">空</span>
    </div>
    <ol class="songs" id="songs"></ol>
    <div class="empty" id="empty">还没有人点歌</div>
    <div class="more" id="more" hidden></div>
  </section>
</div>

<script>
  const params = new URLSearchParams(location.search);

  // ?accent=%23ff7bb0&scale=1.2&card=transparent&radius=20&font=...
  function applyParams() {
    const map = { accent: "--accent", text: "--text", sub: "--sub", card: "--card", radius: "--radius", scale: "--scale", font: "--font" };
    for (const [key, prop] of Object.entries(map)) {
      const value = params.get(key);
      if (value) document.documentElement.style.setProperty(prop, value);
    }
    if (params.get("rules") === "0") document.getElementById("rules-card").hidden = true;
    const rulesTitle = params.get("rulesTitle");
    if (rulesTitle) document.getElementById("rules-title").textContent = rulesTitle;
    const listTitle = params.get("listTitle");
    if (listTitle) document.getElementById("list-title").textContent = listTitle;
  }

  const limit = Math.max(1, Number(params.get("limit") || 8));
  const showUser = params.get("user") !== "0";
  const songs = document.getElementById("songs");
  const empty = document.getElementById("empty");
  const more = document.getElementById("more");
  const count = document.getElementById("count");

  function render(state) {
    const queue = state.queue || [];
    empty.hidden = queue.length > 0;
    count.textContent = queue.length ? `${queue.length} 首` : "空";
    songs.replaceChildren(...queue.slice(0, limit).map((item, index) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="idx">${index + 1}</span><div class="song-meta"><span class="name"></span></div><div class="tags"></div>`;
      li.querySelector(".name").textContent = item.name;
      const meta = li.querySelector(".song-meta");
      const tags = li.querySelector(".tags");
      if (item.priority) {
        const tag = document.createElement("span");
        tag.className = "tag cut";
        tag.textContent = "插队";
        tags.append(tag);
      }
      if (item.state === "processing" || item.state === "waiting") {
        const tag = document.createElement("span");
        tag.className = "tag wait";
        tag.textContent = item.state === "processing" ? "搜索中" : "排队中";
        tags.append(tag);
      }
      if (showUser) {
        const user = document.createElement("span");
        user.className = "user";
        user.textContent = `点歌 · ${item.user}`;
        meta.append(user);
      }
      return li;
    }));
    const rest = queue.length - limit;
    more.hidden = rest <= 0;
    more.textContent = rest > 0 ? `还有 ${rest} 首…` : "";
  }

  applyParams();

  // OBS 里页面可能先于点歌姬启动，断线后自己重连。
  let source;
  function connect() {
    source = new EventSource("/api/events");
    source.onmessage = (event) => render(JSON.parse(event.data));
    source.onerror = () => {
      source.close();
      setTimeout(connect, 2000);
    };
  }
  connect();
</script>
</body>
</html>
